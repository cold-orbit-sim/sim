version: 2

# One combined PR per week across all ecosystems.
multi-ecosystem-groups:
  all:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all"
    ignore:
      # MQTTnet 5.x locked in master plan; major bumps need design review
      - dependency-name: "MQTTnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all"
